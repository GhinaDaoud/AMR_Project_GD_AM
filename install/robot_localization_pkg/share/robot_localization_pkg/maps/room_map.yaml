# The image file containing the map data (white = free, black = occupied, gray = unknown)
image: room_map.pgm

# The size of one pixel in meters (0.05 means each pixel represents 5cm x 5cm)
resolution: 0.05

# The real-world coordinates [x, y, yaw] of the bottom-left pixel of the map
# [-5.0, -5.0, 0.0] means the bottom-left corner is 5 meters left and 5 meters down from (0,0)
origin: [-5.0, -5.0, 0.0]

# Whether white/black should be reversed (0 = normal, 1 = negated)
negate: 0

# Pixels with an occupancy probability greater than this are considered "Walls" (Occupied)
occupied_thresh: 0.65

# Pixels with an occupancy probability less than this are considered "Empty space" (Free)
free_thresh: 0.25

# Trinary mode means the map is strictly divided into three states: 
# Occupied (100), Free (0), or Unknown (-1). 
mode: trinary